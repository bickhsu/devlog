[package]
name = "devlog-desktop"
version = "0.1.0"
description = "DevLog desktop application"
authors = ["bickhsu"]
edition = "2021"

[lib]
name = "devlog_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
serde_json = "1"
# The mock runtime lets tests invoke commands and observe emitted events.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
